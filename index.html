<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embroidery Design Catalog</title>
    <meta name="description" content="Premium embroidery design catalog with high-quality images and design numbers.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <h1 class="logo">TioraS <span>Designs</span></h1>
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search design number (e.g. 1004)..." autocomplete="off">
            </div>
            <div class="stats" id="statsDisplay">Loading...</div>
        </div>
    </header>

    <main class="main-content">
        <div class="gallery-container" id="gallery">
            <!-- Images will be injected here via JS -->
        </div>
        <div class="loading-indicator" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Loading more designs...</p>
        </div>
        <div class="no-results" id="noResults" style="display: none;">
            <h2>No designs found</h2>
            <p>Try searching for a different number.</p>
        </div>
    </main>

    <!-- Modal for full image view -->
    <div class="modal" id="imageModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="close-btn" id="closeModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="Full size design">
            </div>
            <div class="modal-info">
                <h3 id="modalTitle">Design #</h3>
                <a id="modalDownload" href="" download class="download-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download High-Res
                </a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
